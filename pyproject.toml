[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadowsocks-tui"
version = "1.0.0"
description = "A fast, modern Shadowsocks TUI client with TUN mode, system proxy, and IPv6 leak protection."
readme = "README.md"
authors = [
    { name = "GoldenDragonJD", email = "lisbe2003@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["shadowsocks", "vpn", "tui", "proxy", "tun", "privacy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
]
dependencies = [
    "uibuilder>=0.5.2",
]

[project.scripts]
shadowsocks-tui = "shadowsocks_tui.main:main"
sstui = "shadowsocks_tui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["shadowsocks_tui*"]

[project.urls]
Homepage = "https://github.com/GoldenDragonJD/shadowsocks-tui"
Repository = "https://github.com/GoldenDragonJD/shadowsocks-tui.git"
Issues = "https://github.com/GoldenDragonJD/shadowsocks-tui/issues"
